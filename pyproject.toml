[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pe-bench"
version = "0.1.0"
description = "Automated bench test for a DC-DC converter: SCPI sweep, CSV log, pass/fail report"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "matplotlib>=3.8", "pyyaml>=6", "pyvisa>=1.14"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
pe-bench = "pe_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pe_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/pe_bench/reporting/html.py" = ["E501"]
