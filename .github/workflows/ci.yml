name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=pe_bench --cov-report=term-missing

  demo-reports:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Run the demo specs (exit codes 0 / 1 / 2 = pass / fail / abort)
        run: |
          pe-bench specs/buck_5v.yaml --sim --out results
          pe-bench specs/buck_5v_marginal.yaml --sim --out results || test $? -eq 1
          pe-bench specs/buck_5v_overcurrent.yaml --sim --out results || test $? -eq 2
      - uses: actions/upload-artifact@v4
        with:
          name: bench-reports
          path: results/
